document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   <button class=\"applies-btn {{ c.siCls }}\" onclick=\"{{ c.setSi }}\" style=\"{{ c.siStyle }}\">Aplica<\u002Fbutton>\n                <button class=\"applies-btn {{ c.noCls }}\" onclick=\"{{ c.setNo }}\" style=\"{{ c.noStyle }}\">No aplica<\u002Fbutton>\n              <\u002Fdiv>\n              <button class=\"noprint\" onclick=\"{{ c.remove }}\" title=\"Quitar\" style=\"border:none;background:transparent;color:#c4383a;font-size:20px;line-height:1;cursor:pointer;padding:0 4px;\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button class=\"noprint\" onclick=\"{{ addConcept }}\" style=\"margin-top:12px;border:1.5px dashed #cbc4bb;background:transparent;color:#6f6a64;font-weight:600;font-size:13px;padding:9px 14px;border-radius:7px;cursor:pointer;\">+ Agregar concepto<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-bottom:34px;\">\n      <div style=\"font-size:15px;font-weight:800;letter-spacing:0.1em;margin-bottom:10px;\">TÉRMINOS DE LA ENTREGA<\u002Fdiv>\n      <textarea class=\"legal fld\" value=\"{{ legalText }}\" oninput=\"{{ onLegal }}\" rows=\"8\" style=\"width:100%;border:none;border-bottom:1px solid transparent;background:transparent;font-size:13.5px;line-height:1.7;color:#332d28;padding:2px;\"><\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div class=\"sigrow\" style=\"display:flex;gap:44px;margin-top:8px;\">\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;\">\n        <div style=\"position:relative;width:100%;\">\n          <canvas class=\"sigpad\" id=\"sig-cliente\" width=\"640\" height=\"150\" style=\"width:100%;height:96px;border:1px solid #ddd8d2;border-radius:6px;touch-action:none;cursor:crosshair;background:#fff;\"><\u002Fcanvas>\n          <button class=\"noprint\" onclick=\"{{ clearCliente }}\" style=\"position:absolute;top:6px;right:6px;border:none;background:#f3efe9;color:#6f6a64;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;cursor:pointer;\">Borrar<\u002Fbutton>\n        <\u002Fdiv>\n        <input class=\"fld\" value=\"{{ clienteFirma }}\" oninput=\"{{ onClienteFirma }}\" placeholder=\"Nombre completo\" style=\"width:100%;text-align:center;border:none;border-bottom:1px solid #ddd8d2;background:transparent;font-size:14px;padding:6px 2px;margin-top:8px;\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;color:#6f6a64;margin-top:8px;\">FIRMA DE RECIBIDO — CLIENTE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;\">\n        <div style=\"position:relative;width:100%;\">\n          <canvas class=\"sigpad\" id=\"sig-asesor\" width=\"640\" height=\"150\" style=\"width:100%;height:96px;border:1px solid #ddd8d2;border-radius:6px;touch-action:none;cursor:crosshair;background:#fff;\"><\u002Fcanvas>\n          <button class=\"noprint\" onclick=\"{{ clearAsesor }}\" style=\"position:absolute;top:6px;right:6px;border:none;background:#f3efe9;color:#6f6a64;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;cursor:pointer;\">Borrar<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"noprint\" style=\"display:flex;gap:5px;margin-top:8px;\">\n          <button onclick=\"{{ setJoel }}\" style=\"{{ joelStyle }}\">Joel<\u002Fbutton>\n          <button onclick=\"{{ setCarlos }}\" style=\"{{ carlosStyle }}\">Carlos<\u002Fbutton>\n          <button onclick=\"{{ setCustom }}\" style=\"{{ customStyle }}\">Personalizado<\u002Fbutton>\n        <\u002Fdiv>\n        <input class=\"fld\" value=\"{{ asesorFirma }}\" oninput=\"{{ onAsesorFirma }}\" placeholder=\"Nombre completo\" style=\"width:100%;text-align:center;border:none;border-bottom:1px solid #ddd8d2;background:transparent;font-size:14px;padding:6px 2px;margin-top:8px;\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;color:#6f6a64;margin-top:8px;\">FIRMA DE RECIBIDO — ASESOR<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:1180},&quot;defaultVersion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rehab&quot;,&quot;actual&quot;],&quot;default&quot;:&quot;rehab&quot;,&quot;tsType&quot;:&quot;'rehab' | 'actual'&quot;,&quot;section&quot;:&quot;Documento&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f5fae&quot;,&quot;options&quot;:[&quot;#171310&quot;,&quot;#1f5fae&quot;,&quot;#1f7a4d&quot;,&quot;#8a5a1f&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estilo&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    version: null,\n    domicilio: '',\n    fecha: '',\n    cliente: '',\n    clienteFirma: '',\n    asesorMode: 'joel',\n    asesorFirma: 'Angel Joel Garcia Gutierrez',\n    concepts: [\n      { id: 1, text: 'PINTURA EXTERIOR E INTERIOR', applies: 'si' },\n      { id: 2, text: 'IMPERMEABILIZADO', applies: 'si' },\n      { id: 3, text: 'RESANES', applies: 'si' },\n      { id: 4, text: 'PINTURA DE HERRERÍA', applies: 'si' },\n      { id: 5, text: 'PUERTAS Y MARCOS (CUARTOS, BAÑO Y PATIO): REPARACIÓN O CAMBIO', applies: 'si' },\n      { id: 6, text: 'JUEGO DE BAÑO (TAZA, MANERALES, REGADERA Y LAVABO NUEVOS)', applies: 'si' },\n      { id: 7, text: 'LAVADERO NUEVO', applies: 'si' },\n      { id: 8, text: 'ACCESORIOS ELÉCTRICOS NUEVOS', applies: 'si' },\n      { id: 9, text: 'TARJA NUEVA', applies: 'si' },\n      { id: 10, text: 'CHAPAS NUEVAS', applies: 'si' },\n      { id: 11, text: 'VIDRIOS ROTOS SE CAMBIAN NUEVOS', applies: 'si' },\n    ],\n    legal: {\n      rehab: 'La Inmobiliaria NEOVIT se compromete a entregar la vivienda rehabilitada al cliente dentro de un plazo máximo de quince (15) días hábiles contados a partir de la firma de la escritura pública de compraventa.\\n\\nEl cliente contará con un plazo de treinta (30) días naturales a partir de la entrega física de la vivienda para:\\n1. Revisar el estado general del inmueble y reportar por escrito cualquier falla, defecto o detalle pendiente de corrección derivado de la rehabilitación realizada.\\n2. Solicitar las copias certificadas de la escritura pública correspondientes.\\n3. Realizar el trámite para la contratación del servicio de energía eléctrica (CFE) a su nombre.\\n\\nEn caso de que el cliente no realice dichos reportes o solicitudes dentro del plazo indicado, se entenderá que ha recibido la vivienda a su entera satisfacción y cualquier garantía por parte de la Inmobiliaria NEOVIT quedará sin efecto después del vencimiento de dicho término.',\n      actual: 'La Inmobiliaria NEOVIT hace entrega de la vivienda al cliente en las condiciones físicas actuales en que se encuentra (\"tal como está\"), mismas que el cliente ha inspeccionado y acepta a su entera satisfacción, sin que la Inmobiliaria quede obligada a realizar rehabilitación, reparación o modificación alguna posterior a la presente entrega.\\n\\nEl cliente contará con un plazo de treinta (30) días naturales a partir de la entrega física de la vivienda para:\\n1. Solicitar las copias certificadas de la escritura pública correspondientes.\\n2. Realizar el trámite para la contratación del servicio de energía eléctrica (CFE) a su nombre.\\n\\nTranscurrido dicho plazo sin que el cliente presente reporte por escrito, se entenderá que ha recibido la vivienda a su entera satisfacción en las condiciones pactadas.',\n    },\n  };\n\n  version() {\n    return this.state.version || this.props.defaultVersion || 'rehab';\n  }\n\n  set(key, e) { this.setState({ [key]: e.target.value }); }\n\n  updateConcept(id, text) {\n    this.setState(s => ({ concepts: s.concepts.map(c => c.id === id ? { ...c, text } : c) }));\n  }\n  setApplies(id, applies) {\n    this.setState(s => ({ concepts: s.concepts.map(c => c.id === id ? { ...c, applies } : c) }));\n  }\n  removeConcept(id) {\n    this.setState(s => ({ concepts: s.concepts.filter(c => c.id !== id) }));\n  }\n  addConcept() {\n    this.setState(s => ({ concepts: [...s.concepts, { id: Date.now(), text: '', applies: 'si' }] }));\n  }\n  setLegal(e) {\n    const v = this.version();\n    const val = e.target.value;\n    this.setState(s => ({ legal: { ...s.legal, [v]: val } }));\n  }\n\n  resizeTextareas() {\n    document.querySelectorAll('textarea.legal').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });\n  }\n\n  initSig(canvas) {\n    if (!canvas || canvas.dataset.init) return;\n    canvas.dataset.init = '1';\n    const ctx = canvas.getContext('2d');\n    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#171310';\n    let drawing = false, last = null;\n    const pos = (e) => {\n      const r = canvas.getBoundingClientRect();\n      return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };\n    };\n    canvas.addEventListener('pointerdown', (e) => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); e.preventDefault(); });\n    canvas.addEventListener('pointermove', (e) => {\n      if (!drawing) return;\n      const p = pos(e);\n      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();\n      last = p; e.preventDefault();\n    });\n    const stop = () => { drawing = false; };\n    canvas.addEventListener('pointerup', stop);\n    canvas.addEventListener('pointerleave', stop);\n  }\n  clearSig(id) {\n    const c = document.getElementById(id);\n    if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);\n  }\n\n  savePdf() {\n    const el = document.querySelector('.sheet');\n    if (!el || !window.html2pdf) { window.print(); return; }\n    const cliente = (this.state.cliente || '').trim();\n    const name = 'Carta de entrega NEOVIT' + (cliente ? ' - ' + cliente : '');\n\n    // Convertir campos de formulario en texto plano para que no se desplacen al capturar\n    const swaps = [];\n    el.querySelectorAll('input.fld, textarea.legal').forEach((f) => {\n      const cs = getComputedStyle(f);\n      const isArea = f.tagName === 'TEXTAREA';\n      const div = document.createElement('div');\n      div.textContent = f.value || '';\n      div.style.font = cs.font;\n      div.style.lineHeight = cs.lineHeight;\n      div.style.color = cs.color;\n      div.style.textAlign = cs.textAlign;\n      div.style.letterSpacing = cs.letterSpacing;\n      div.style.padding = cs.padding;\n      div.style.whiteSpace = isArea ? 'pre-wrap' : 'nowrap';\n      div.style.overflow = 'hidden';\n      div.style.boxSizing = 'border-box';\n      if (isArea) { div.style.width = '100%'; }\n      else {\n        div.style.flex = cs.flex;\n        div.style.borderBottom = '1px solid #ddd8d2';\n        div.style.textOverflow = 'ellipsis';\n        div.style.minWidth = '0';\n      }\n      div.dataset.pdfSwap = '1';\n      f.style.display = 'none';\n      f.parentNode.insertBefore(div, f);\n      swaps.push([f, div]);\n    });\n\n    const cleanup = () => {\n      document.body.classList.remove('pdf-capturing');\n      swaps.forEach(([f, div]) => { f.style.display = ''; div.remove(); });\n    };\n\n    document.body.classList.add('pdf-capturing');\n    const w = el.getBoundingClientRect().width;\n    window.html2pdf().set({\n      margin: [10, 10, 10, 10],\n      filename: name + '.pdf',\n      image: { type: 'jpeg', quality: 0.98 },\n      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', width: w, windowWidth: w, scrollX: 0, scrollY: 0 },\n      jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },\n      pagebreak: { mode: ['css', 'legacy'] },\n    }).from(el).save().then(cleanup).catch(() => { cleanup(); window.print(); });\n  }\n\n  componentDidMount() {\n    this.resizeTextareas();\n    this.initSig(document.getElementById('sig-cliente'));\n    this.initSig(document.getElementById('sig-asesor'));\n  }\n  componentDidUpdate() {\n    this.resizeTextareas();\n    this.initSig(document.getElementById('sig-cliente'));\n    this.initSig(document.getElementById('sig-asesor'));\n  }\n\n  renderVals() {\n    const v = this.version();\n    const accent = this.props.accentColor || '#171310';\n    const isRehab = v === 'rehab';\n    const tabOn = { border: 'none', padding: '8px 15px', borderRadius: '6px', fontSize: '13px', fontWeight: '700', cursor: 'pointer', background: '#fff', color: '#171310' };\n    const tabOff = { border: 'none', padding: '8px 15px', borderRadius: '6px', fontSize: '13px', fontWeight: '600', cursor: 'pointer', background: 'transparent', color: 'rgba(255,255,255,0.75)' };\n\n    const btnBase = { border: '1.5px solid', padding: '5px 11px', borderRadius: '6px', fontSize: '12px', fontWeight: '700', cursor: 'pointer', whiteSpace: 'nowrap' };\n    const on = (extra) => ({ ...btnBase, background: accent, borderColor: accent, color: '#fff' });\n    const off = () => ({ ...btnBase, background: '#fff', borderColor: '#ddd8d2', color: '#a49d94' });\n\n    const concepts = this.state.concepts.map((c, i) => {\n      const si = c.applies === 'si';\n      return {\n        text: c.text, num: i + 1,\n        siStyle: si ? on() : off(), noStyle: si ? off() : on(),\n        siCls: si ? 'sel' : 'unsel', noCls: si ? 'unsel' : 'sel',\n        onText: (e) => this.updateConcept(c.id, e.target.value),\n        setSi: () => this.setApplies(c.id, 'si'),\n        setNo: () => this.setApplies(c.id, 'no'),\n        remove: () => this.removeConcept(c.id),\n      };\n    });\n\n    return {\n      accent,\n      isRehab,\n      versionLabel: isRehab ? 'Entrega de vivienda rehabilitada' : 'Entrega en condiciones actuales',\n      tabRehabStyle: isRehab ? tabOn : tabOff,\n      tabActualStyle: isRehab ? tabOff : tabOn,\n      goRehab: () => this.setState({ version: 'rehab' }),\n      goActual: () => this.setState({ version: 'actual' }),\n      doPrint: () => this.savePdf(),\n      domicilio: this.state.domicilio, onDomicilio: (e) => this.set('domicilio', e),\n      fecha: this.state.fecha, onFecha: (e) => this.set('fecha', e),\n      cliente: this.state.cliente, onCliente: (e) => this.set('cliente', e),\n      clienteFirma: this.state.clienteFirma, onClienteFirma: (e) => this.set('clienteFirma', e),\n      asesorFirma: this.state.asesorFirma,\n      onAsesorFirma: (e) => this.setState({ asesorFirma: e.target.value, asesorMode: 'custom' }),\n      joelStyle: this.state.asesorMode === 'joel' ? on() : off(),\n      carlosStyle: this.state.asesorMode === 'carlos' ? on() : off(),\n      customStyle: this.state.asesorMode === 'custom' ? on() : off(),\n      setJoel: () => this.setState({ asesorMode: 'joel', asesorFirma: 'Angel Joel Garcia Gutierrez' }),\n      setCarlos: () => this.setState({ asesorMode: 'carlos', asesorFirma: 'Carlos Jadiel Salazar Torres' }),\n      setCustom: () => this.setState({ asesorMode: 'custom', asesorFirma: '' }),\n      clearCliente: () => this.clearSig('sig-cliente'),\n      clearAsesor: () => this.clearSig('sig-asesor'),\n      concepts,\n      legalText: this.state.legal[v],\n      onLegal: (e) => this.setLegal(e),\n      addConcept: () => this.addConcept(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
